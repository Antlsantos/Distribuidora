<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Página de Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <div class="logo">
      <img src="logo.png" alt="Logo da Marca">
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Título -->
  <section class="contato-intro">
    <h1>Entre em Contato Conosco</h1>
    <p>Estamos aqui para ajudá-lo com qualquer dúvida ou sugestão. Fique à vontade para nos enviar uma mensagem!</p>
  </section>

  <!-- Formulário de Contato -->
  <section class="formulario-contato">
    <h2>Envie uma Mensagem</h2>
    <form action="enviar_formulario.php" method="POST">
      <label for="nome">Seu Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">Seu E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem">Sua Mensagem:</label>
      <textarea id="mensagem" name="mensagem" required></textarea>

      <button type="submit" class="cta">Enviar Mensagem</button>
    </form>
  </section>

  <!-- Rodapé -->
  <footer>

  </footer>
